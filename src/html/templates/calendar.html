			<div class="course_name"></div>
			<div class="assignment_description"></div>
			<div class="end_time"></div>

		<div class="actions">

			<img src="../../icons/unfinish.svg" title="סמן כמטלה לביצוע" class="unfinish" alt="סמן כמטלה לביצוע" />
		</div>
	</div>
